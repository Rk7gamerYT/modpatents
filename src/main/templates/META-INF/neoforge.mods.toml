modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Rk7gamerYT/modpatents/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="modpatents_logo.png"
authors="Rk7gamerYT"
displayURL="https://github.com/Rk7gamerYT/modpatents"
description='''
Bloqueia crafts de itens de mods por jogador, configurado em config/modpatents.json.
Só precisa estar instalado no servidor.
'''
# Mod só de servidor: clientes sem o mod podem entrar normalmente
displayTest="IGNORE_SERVER_VERSION"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
